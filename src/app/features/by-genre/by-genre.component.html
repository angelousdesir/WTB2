<div class="by-genre-container">
  <div class="content-wrapper">
    <!-- Header -->
    <div class="page-header">
      <h1>Browse by Category</h1>
      <p>Explore reviews organized by food and drink types</p>
    </div>

    <!-- Categories Grid -->
    <div class="categories-grid">
      <div 
        *ngFor="let category of categories" 
        class="category-card"
        [class.selected]="selectedCategory === category.name"
        (click)="selectCategory(category.name)">
        
        <div class="category-icon" [style.background]="'linear-gradient(135deg, ' + category.color + ', ' + category.color + '99)'">
          <span>{{ category.icon }}</span>
        </div>
        <h3>{{ category.name }}</h3>
      </div>
    </div>

    <!-- Category Posts -->
    <div class="category-posts-section" *ngIf="selectedCategory">
      <div class="section-header">
        <h2>{{ selectedCategory }}</h2>
        <button class="btn-clear" (click)="clearSelection()">← Back to Categories</button>
      </div>

      <div *ngIf="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading {{ selectedCategory.toLowerCase() }}...</p>
      </div>

      <div *ngIf="!loading && categoryPosts.length === 0" class="empty-state">
        <div class="empty-icon">📭</div>
        <p>No reviews in this category yet</p>
        <button class="btn-primary" routerLink="/create-post">Be the First to Review</button>
      </div>

      <div class="posts-grid" *ngIf="!loading && categoryPosts.length > 0">
        <app-post-card *ngFor="let post of categoryPosts" [post]="post"></app-post-card>
      </div>
    </div>
  </div>
</div>
