<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">F&B</span>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to continue to FoodBar Reviews</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="you@example.com"
          [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <span class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please enter a valid email address
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <span class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password must be at least 6 characters
        </span>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading || loginForm.invalid">
        <span *ngIf="!loading">Sign In</span>
        <div *ngIf="loading" class="spinner"></div>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a (click)="navigateToRegister()">Sign up</a></p>
    </div>
  </div>
</div>
