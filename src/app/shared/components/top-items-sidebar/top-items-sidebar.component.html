<div class="top-items-sidebar">
  <div class="sidebar-header">
    <h3>🏆 Top Rated Items</h3>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
  </div>

  <div class="items-list" *ngIf="!loading">
    <div *ngFor="let item of topItems; let i = index" class="top-item">
      <div class="item-rank">{{ i + 1 }}</div>
      
      <div 
        class="item-image" 
        *ngIf="item.image_url"
        [style.background-image]="'url(' + item.image_url + ')'">
      </div>
      
      <div class="item-info">
        <h4 class="item-name">{{ item.name }}</h4>
        <p class="item-venue" *ngIf="item.venue">
          {{ item.venue.name }}
        </p>
        <div class="item-footer">
          <span class="item-rating">
            ⭐ {{ item.average_rating.toFixed(1) }}
          </span>
          <span class="item-price" *ngIf="item.price">
            ${{ item.price.toFixed(2) }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
