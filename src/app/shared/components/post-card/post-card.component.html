<div class="post-card">
  <!-- Post Image -->
  <div 
    class="post-image" 
    *ngIf="post.image_url"
    [style.background-image]="'url(' + post.image_url + ')'">
  </div>

  <!-- Post Header -->
  <div class="post-header">
    <div class="user-info">
      <!--
      <div class="user-avatar">
        {{ getUserInitial() }}
      </div>
      -->
      <div class="user-details">
        <h4 class="username">{{ post.user?.username || 'Anonymous' }}</h4>
        <!-- <p class="post-date">{{ getFormattedDate() }} </p> -->
      </div>
    </div>

    <!-- Rating -->
    <div class="post-rating">
      <div class="stars">
        <span *ngFor="let star of [1,2,3,4,5]" class="star" [class.filled]="star <= post.rating">⭐</span>
      </div>
      <span class="rating-value">{{ post.rating.toFixed(1) }}</span>
    </div>
  </div>

  <!-- Post Content -->
  <div class="post-content">
    <h3 class="post-title">{{ post.title }}</h3>
    <p class="post-text">{{ post.content }}</p>
  </div>

  <!-- Menu Item Tag (if post is about a specific menu item) -->
  <div class="menu-item-tag" *ngIf="post.menu_item">
    <span class="item-icon">🍽️</span>
    <div class="item-info">
      <span class="item-name">{{ post.menu_item.name }}</span>
      <div class="item-meta">
        <span class="item-category" *ngIf="post.menu_item.category">{{ post.menu_item.category }}</span>
        <span class="item-price" *ngIf="post.menu_item.price">${{ post.menu_item.price.toFixed(2) }}</span>
      </div>
    </div>
  </div>

  <!-- Venue Info -->
  <div class="post-footer" *ngIf="post.venue">
    <div class="venue-tag">
      <span class="venue-icon">🏪</span>
      <span class="venue-name">{{ post.venue.name }}</span>
      <span class="venue-location">{{ post.venue.city }}, {{ post.venue.state }}</span>
    </div>
  </div>
</div>
